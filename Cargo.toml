[package]
name = "edit"
version = "0.1.0"
edition = "2021"
description = "A fast Sublime-style text editor with IntelliJ-style editing (camel humps, extend selection)"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
ropey = "1.6"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
regex = "1"
rfd = "0.15"
similar = "2"
arboard = "3"
notify = "6"
miniz_oxide = "0.8"
time = { version = "0.3", features = ["local-offset"] }
# Markdown preview (egui_commonmark 0.18 = egui 0.29); images: png/jpeg/gif only
egui_commonmark = { version = "0.18", default-features = false, features = ["pulldown_cmark", "load-images"] }
egui_extras = { version = "0.29", default-features = false, features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# syntect is very slow unoptimised; keep debug builds usable
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
png = "0.17"

[build-dependencies]
embed-resource = "3"
